<rect x="405.4" y="258.4" width="49.1" height="24" rx="12" fill="#FFFFFF"/>
<text x="430" y="276.2" font-size="16" font-weight="500" text-anchor="middle" fill="#566070">calls</text>
<text x="56" y="717.6" font-size="20" font-weight="700" fill="#7A360E">Port contract</text>
<text x="56" y="748.2" font-size="17" fill="#2B3442">I2cInterface&lt;YourPort&gt;: checked at compile time, no virtual calls</text>
<text x="56" y="870.6" font-size="20" font-weight="700" fill="#0B5F59">Your port</text>
<text x="56" y="899.8" font-size="16" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#2B3442">EnsureInitialized()  Write()  WriteRead()</text>
<text x="56" y="1022.6" font-size="20" font-weight="700" fill="#334155">PF1550</text>
<text x="56" y="1053.2" font-size="17" fill="#2B3442">the chip, on the I2C bus</text>
<rect x="322.9" y="638.6" width="214.1" height="24" rx="12" fill="#FFFFFF"/>
<text x="430" y="656.4" font-size="16" font-weight="500" text-anchor="middle" fill="#566070">register reads and writes</text>
<rect x="329.6" y="791.6" width="200.8" height="24" rx="12" fill="#FFFFFF"/>
<text x="430" y="809.4" font-size="16" font-weight="500" text-anchor="middle" fill="#566070">forwards to your hooks</text>
<rect x="371.3" y="943.6" width="117.4" height="24" rx="12" fill="#FFFFFF"/>
<text x="430" y="961.4" font-size="16" font-weight="500" text-anchor="middle" fill="#566070">I2C transfers</text>
<text x="886" y="337.4" font-size="20" font-weight="700" fill="#7A360E">Shared</text>
<text x="886" y="360.8" font-size="17" fill="#7A360E">The core and the contract are</text>
<text x="886" y="385.5" font-size="17" fill="#7A360E">the same code on every MCU</text>
<text x="886" y="410.1" font-size="17" fill="#7A360E">and on the host.</text>
<text x="886" y="870.6" font-size="20" font-weight="700" fill="#0B5F59">Yours</text>
<text x="886" y="894.1" font-size="17" fill="#0B5F59">One small class per MCU or</text>
<text x="886" y="918.7" font-size="17" fill="#0B5F59">board.</text>
