<text x="524" y="408.3" font-size="13" fill="#D2DAE4">OTP</text>
<text x="820" y="228.6" font-size="15" font-weight="700" fill="#FDE68A">Battery charger</text>
<text x="820" y="253.4" font-size="13" fill="#D2DAE4">linear charger, power</text>
<text x="820" y="272.2" font-size="13" fill="#D2DAE4">path</text>
<text x="820" y="364.6" font-size="15" font-weight="700" fill="#A7F3E6">Buck regulators</text>
<text x="820" y="389.4" font-size="13" fill="#D2DAE4">SW1 and SW2 with</text>
<text x="820" y="408.3" font-size="13" fill="#D2DAE4">DVS, SW3</text>
<text x="820" y="516.5" font-size="15" font-weight="700" fill="#A7F3E6">LDOs and VREFDDR</text>
