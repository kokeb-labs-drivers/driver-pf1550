<text x="245.4" y="162.8" font-size="12" fill="#E2E8F0">HVQFN-40</text>
<text x="228" y="228.6" font-size="15" font-weight="700" fill="#BFDBFE">Control interface</text>
<text x="228" y="253.4" font-size="13" fill="#D2DAE4">I2C and INTB</text>
<text x="228" y="364.6" font-size="15" font-weight="700" fill="#E2E8F0">State machine</text>
<text x="228" y="389.4" font-size="13" fill="#D2DAE4">ONKEY, PWRON,</text>
<text x="228" y="408.3" font-size="13" fill="#D2DAE4">STANDBY</text>
<text x="228" y="516.5" font-size="15" font-weight="700" fill="#F8D27A">VSNVS and coin cell</text>
<text x="228" y="541.4" font-size="13" fill="#D2DAE4">always on</text>
<text x="524" y="364.6" font-size="15" font-weight="700" fill="#DDD6FE">Registers</text>
