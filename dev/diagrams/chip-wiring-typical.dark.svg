<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="938" viewBox="0 0 1200 938" role="img" aria-labelledby="chip-wiring-typical-title chip-wiring-typical-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="chip-wiring-typical-title">Wiring: Control connections to a host processor</title>
<desc id="chip-wiring-typical-desc">Wiring of the PF1550 for the Control connections to a host processor: Host I2C SDA to SDA (Write(), WriteRead()); Host I2C SCL to SCL (Write(), WriteRead()); Host GPIO (STANDBY) to STANDBY (GpioSet(CtrlPin::Standby)); Host GPIO (INTB) to INTB (GpioGet(CtrlPin::Intb)). Supplies, grounds and the support parts are listed under the drawing.</desc>
<rect x="0.5" y="0.5" width="1199" height="937" rx="16" fill="#0E131A" stroke="#283241"/>
<text x="32" y="46.8" font-size="16" font-weight="700" letter-spacing="1.2" fill="#F8D27A">PINS AND WIRING</text>
<text x="32" y="85.6" font-size="32" font-weight="700" fill="#E8EDF3">Wiring: Control connections to a host processor</text>
<text x="32" y="115.4" font-size="18" fill="#9AA6B5">What you connect by hand, with the driver hook on each MCU wire. The full schematic, with every part and value, is on the</text>
<text x="32" y="141.5" font-size="18" fill="#9AA6B5">Hardware page. Datasheet: 13.1 Example schematic, p. 133.</text>
<rect x="32" y="157.5" width="1136" height="1" fill="#252F3C"/>
