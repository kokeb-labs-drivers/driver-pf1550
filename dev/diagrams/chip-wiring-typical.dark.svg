<text x="847.2" y="232.9" font-size="16" text-anchor="middle" fill="#9AA6B5">U1</text>
<text x="250.8" y="210.5" font-size="20" font-weight="700" fill="#BFDBFE">Host</text>
<text x="250.8" y="232.9" font-size="16" fill="#BFDBFE">U2</text>
<text x="414.8" y="286.1" font-size="16" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="end" fill="#BFDBFE">I2C SDA</text>
<text x="749.2" y="286.1" font-size="16" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#E8EDF3">SDA</text>
<rect x="713.2" y="274.3" width="14" height="12" rx="2" fill="#13233A" stroke="#60A5FA" stroke-width="1.4"/>
<text x="573" y="270.3" font-size="16" font-weight="600" text-anchor="middle" fill="#D2DAE4">SDA  pin 2</text>
<text x="573" y="303.1" font-size="16" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="middle" fill="#9AA6B5">Write(), WriteRead()</text>
<text x="573" y="324.7" font-size="16" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="middle" fill="#9AA6B5">+ R1 2.2 kΩ</text>
<text x="414.8" y="371.7" font-size="16" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="end" fill="#BFDBFE">I2C SCL</text>
<text x="749.2" y="371.7" font-size="16" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#E8EDF3">SCL</text>
<rect x="713.2" y="359.9" width="14" height="12" rx="2" fill="#13233A" stroke="#60A5FA" stroke-width="1.4"/>
<text x="573" y="355.9" font-size="16" font-weight="600" text-anchor="middle" fill="#D2DAE4">SCL  pin 3</text>
<text x="573" y="388.7" font-size="16" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="middle" fill="#9AA6B5">Write(), WriteRead()</text>
<text x="573" y="410.3" font-size="16" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="middle" fill="#9AA6B5">+ R2 2.2 kΩ</text>
<text x="414.8" y="457.3" font-size="16" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="end" fill="#BFDBFE">GPIO (STANDBY)</text>
<text x="749.2" y="457.3" font-size="16" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#E8EDF3">STANDBY</text>
<rect x="713.2" y="445.5" width="14" height="12" rx="2" fill="#0F2A28" stroke="#2BB3A3" stroke-width="1.4"/>
<text x="573" y="441.5" font-size="16" font-weight="600" text-anchor="middle" fill="#D2DAE4">STANDBY  pin 7</text>
<text x="573" y="474.3" font-size="16" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="middle" fill="#9AA6B5">GpioSet(CtrlPin::Standby)</text>
<text x="414.8" y="542.9" font-size="16" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="end" fill="#BFDBFE">GPIO (INTB)</text>
<text x="749.2" y="542.9" font-size="16" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#E8EDF3">INTB</text>
<rect x="713.2" y="531.1" width="14" height="12" rx="2" fill="#2C2310" stroke="#FBBF24" stroke-width="1.4"/>
<text x="573" y="527.1" font-size="16" font-weight="600" text-anchor="middle" fill="#D2DAE4">INTB  pin 9</text>
<text x="573" y="559.9" font-size="16" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="middle" fill="#9AA6B5">GpioGet(CtrlPin::Intb)</text>
<text x="573" y="581.5" font-size="16" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="middle" fill="#9AA6B5">+ R3 10 kΩ</text>
<text x="50" y="660.9" font-size="20" font-weight="700" fill="#FECDD3">Supplies and ground</text>
<text x="50" y="684.3" font-size="17" fill="#FECDD3">VIO: VDDIO; also U2.VIO · GND: EPAD, VDDOTP; also U2.GND</text>
<text x="50" y="753.9" font-size="20" font-weight="700" fill="#E2E8F0">Also on the board</text>
<text x="50" y="777.4" font-size="17" fill="#E2E8F0">Support parts: 3 resistors around the supplies (values in the full schematic). 32 pins are not drawn in this circuit; the full</text>
<text x="50" y="802" font-size="17" fill="#E2E8F0">schematic lists them.</text>
<text x="32" y="848" font-size="16" fill="#9AA6B5">* Not confirmed in the datasheet: R1: typical value for 400 kHz; size it for the bus; R2: typical value for 400 kHz; size it for the bus; R3: INTB</text>
<text x="32" y="871.1" font-size="16" fill="#9AA6B5">is open drain; any value that suits the host input.</text>
