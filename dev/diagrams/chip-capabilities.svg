<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1158" viewBox="0 0 1200 1158" role="img" aria-labelledby="chip-capabilities-title chip-capabilities-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="chip-capabilities-title">What the PF1550 does</title>
<desc id="chip-capabilities-desc">Capability map of the PF1550: Battery charger (supported): Charges one Li-ion cell: charge voltage and current, termination, timers, watchdog and the status LED; Power path (supported): Runs the system from the input while the cell charges: input current limit, VSYS minimum, battery FET; Battery thermistor and JEITA (supported): Reads the cell's thermistor and lowers or stops the charge when the cell is too cold or too hot; Buck regulators (supported): Sets SW1 to SW3 per state (run, standby, sleep), with dynamic voltage scaling on SW1 and SW2; LDOs, VREFDDR and VSNVS (supported): Sets LDO1 to LDO3, the DDR reference, the RTC supply, the coin cell charger and the USB PHY regulator; Interrupts and status (supported): Pulls INTB low on a fault or event; the driver reads, latches and clears each interrupt group; Power states and sequencer (guarded): Run, standby, sleep, core off and ship states, with the order rails start and stop in; OTP start-up configuration (not covered): Fuses hold the start-up sequence, voltages and charger defaults; the driver reads the option, never fuses.</desc>
