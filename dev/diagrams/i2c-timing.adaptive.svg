<svg xmlns="http://www.w3.org/2000/svg" width="640" height="681" viewBox="0 0 640 681" role="img" aria-labelledby="i2c-timing-title i2c-timing-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" class="fk">
<title id="i2c-timing-title">I2C address byte</title>
<desc id="i2c-timing-desc">I2C address byte of the PF1550: the start condition, the 7-bit address 0x08 with the write bit and the acknowledge, with the clock limit and the minimum edge time the data sheet gives.</desc>
