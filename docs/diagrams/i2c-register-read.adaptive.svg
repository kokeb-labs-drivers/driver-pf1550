<svg xmlns="http://www.w3.org/2000/svg" width="463" height="343" viewBox="0 0 463 343" role="img" aria-labelledby="i2c-register-read-title i2c-register-read-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" class="fk">
<title id="i2c-register-read-title">One register read on the I2C bus</title>
<desc id="i2c-register-read-desc">A register read on the PF1550 I2C bus: the host writes the register address 0x00, repeats the start with the read address, reads one byte and ends with NACK and STOP.</desc>
<style>
