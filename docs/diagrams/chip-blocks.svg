<text x="184" y="162.8" font-size="13" font-weight="700" fill="#334155">PF1550</text>
<text x="245.4" y="162.8" font-size="12" fill="#334155">HVQFN-40</text>
<text x="228" y="228.6" font-size="15" font-weight="700" fill="#1E429F">Control interface</text>
<text x="228" y="253.4" font-size="13" fill="#2B3442">I2C and INTB</text>
<text x="228" y="364.6" font-size="15" font-weight="700" fill="#334155">State machine</text>
<text x="228" y="389.4" font-size="13" fill="#2B3442">ONKEY, PWRON,</text>
<text x="228" y="408.3" font-size="13" fill="#2B3442">STANDBY</text>
<text x="228" y="516.5" font-size="15" font-weight="700" fill="#7A360E">VSNVS and coin cell</text>
<text x="228" y="541.4" font-size="13" fill="#2B3442">always on</text>
<text x="524" y="364.6" font-size="15" font-weight="700" fill="#5B21B6">Registers</text>
<text x="524" y="389.4" font-size="13" fill="#2B3442">interrupts, sequencer,</text>
<text x="524" y="408.3" font-size="13" fill="#2B3442">OTP</text>
<text x="820" y="228.6" font-size="15" font-weight="700" fill="#8A3C0B">Battery charger</text>
<text x="820" y="253.4" font-size="13" fill="#2B3442">linear charger, power</text>
<text x="820" y="272.2" font-size="13" fill="#2B3442">path</text>
<text x="820" y="364.6" font-size="15" font-weight="700" fill="#0B5F59">Buck regulators</text>
<text x="820" y="389.4" font-size="13" fill="#2B3442">SW1 and SW2 with</text>
<text x="820" y="408.3" font-size="13" fill="#2B3442">DVS, SW3</text>
<text x="820" y="516.5" font-size="15" font-weight="700" fill="#0B5F59">LDOs and VREFDDR</text>
<text x="820" y="541.4" font-size="13" fill="#2B3442">LDO1 to LDO3, load</text>
<text x="820" y="560.2" font-size="13" fill="#2B3442">switch</text>
