<svg xmlns="http://www.w3.org/2000/svg" width="463" height="343" viewBox="0 0 463 343" role="img" aria-labelledby="i2c-register-read-title i2c-register-read-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="i2c-register-read-title">One register read on the I2C bus</title>
<desc id="i2c-register-read-desc">A register read on the PF1550 I2C bus: the host writes the register address 0x00, repeats the start with the read address, reads one byte and ends with NACK and STOP.</desc>
<defs><marker id="i2c-register-read-arrow-rail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7C8798"/></marker></defs>
<rect x="0.5" y="0.5" width="462" height="342" rx="16" fill="#FFFFFF" stroke="#E2E7EE"/>
<text x="32" y="54.8" font-size="26" font-weight="700" fill="#0E1726">One register read on the I2C bus</text>
<rect x="32" y="70.8" width="399" height="1" fill="#E2E7EE"/>
<path d="M104.8 144.8 L104.8 346.8" fill="none" stroke="#738093" stroke-width="1.2" stroke-dasharray="5 5"/>
<path d="M358.2 144.8 L358.2 346.8" fill="none" stroke="#738093" stroke-width="1.2" stroke-dasharray="5 5"/>
<path d="M108.8 180.8 L354.2 180.8" fill="none" stroke="#7C8798" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#i2c-register-read-arrow-rail)"/>
<path d="M108.8 224.8 L354.2 224.8" fill="none" stroke="#7C8798" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#i2c-register-read-arrow-rail)"/>
<path d="M354.2 268.8 L108.8 268.8" fill="none" stroke="#7C8798" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#i2c-register-read-arrow-rail)"/>
<path d="M108.8 312.8 L354.2 312.8" fill="none" stroke="#7C8798" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#i2c-register-read-arrow-rail)"/>
<rect x="39.8" y="88.8" width="130" height="52" rx="10" fill="#FDF0FF" stroke="#A21CAF" stroke-width="1.4"/>
<rect x="39.8" y="96.8" width="4" height="36" rx="2" fill="#A21CAF"/>
<rect x="293.2" y="88.8" width="130" height="52" rx="10" fill="#FFF5E3" stroke="#C26A05" stroke-width="1.4"/>
<rect x="293.2" y="96.8" width="4" height="36" rx="2" fill="#C26A05"/>
<text x="107.8" y="119.3" font-size="15" font-weight="700" text-anchor="middle" fill="#86198F">Host</text>
<text x="361.2" y="119.3" font-size="15" font-weight="700" text-anchor="middle" fill="#8A3C0B">PF1550</text>
<rect x="112.8" y="156.8" width="237.5" height="20" rx="10" fill="#FFFFFF"/>
<text x="231.5" y="171.1" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">START, 0x08 + W, 0x00 (DEVICE_ID)</text>
<rect x="144.3" y="200.8" width="174.4" height="20" rx="10" fill="#FFFFFF"/>
<text x="231.5" y="215.1" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">repeated START, 0x08 + R</text>
<rect x="209.6" y="244.8" width="43.9" height="20" rx="10" fill="#FFFFFF"/>
<text x="231.5" y="259.1" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">0x7C</text>
<rect x="186.3" y="288.8" width="90.4" height="20" rx="10" fill="#FFFFFF"/>
<text x="231.5" y="303.1" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">NACK, STOP</text>
</svg>
