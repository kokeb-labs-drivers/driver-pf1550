<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="890" viewBox="0 0 1200 890" role="img" aria-labelledby="chip-hero-title chip-hero-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="chip-hero-title">PF1550</title>
<desc id="chip-hero-desc">Overview of the PF1550, a power management IC for battery-powered boards built around a low-power application processor: it charges a single Li-ion cell and supplies the processor, the memory and the peripherals from three buck converters, three linear regulators and an RTC supply. A MCU talks to it over I2C; it drives Supply rails, then Processor and memory; it reads back Charger input, Li-ion cell, Push buttons. Headline figures: 4.1 to 6.0 V charger input on VBUSIN, USB or adapter; 3 x 1.0 A buck converters, two with voltage scaling; 3 LDOs 300 mA, 400 mA and 300 mA; up to 1 A charge current from 100 mA, charge voltage 3.5 to 4.44 V; 400 kHz I2C, fast mode, 7-bit address; 5 x 5 mm 40-pin QFN with exposed pad.</desc>
