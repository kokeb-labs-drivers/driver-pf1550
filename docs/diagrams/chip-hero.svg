<text x="477" y="256.4" font-size="30" font-weight="700" text-anchor="middle" fill="#0E1726">PF1550</text>
<text x="477" y="286.4" font-size="17" text-anchor="middle" fill="#566070">HVQFN-40</text>
<text x="477" y="310.4" font-size="16" text-anchor="middle" fill="#566070">40 pins + pad</text>
<text x="56" y="240.4" font-size="20" font-weight="700" fill="#1E429F">MCU</text>
<text x="56" y="271" font-size="17" fill="#2B3442">your firmware and</text>
<text x="56" y="295.7" font-size="17" fill="#2B3442">this driver</text>
<rect x="276.2" y="250.4" width="39.5" height="24" rx="12" fill="#FFFFFF"/>
<text x="296" y="268.2" font-size="16" font-weight="500" text-anchor="middle" fill="#566070">I2C</text>
<text x="688" y="228.4" font-size="20" font-weight="700" fill="#0B5F59">Supply rails</text>
<text x="688" y="259" font-size="17" fill="#2B3442">SW1 to SW3, LDO1</text>
<text x="688" y="283.7" font-size="17" fill="#2B3442">to LDO3, VREFDDR,</text>
<text x="688" y="308.4" font-size="17" fill="#2B3442">VSNVS</text>
<text x="970" y="227.4" font-size="20" font-weight="700" fill="#0B5F59">Processor and</text>
<text x="970" y="253.4" font-size="20" font-weight="700" fill="#0B5F59">memory</text>
<text x="970" y="284" font-size="17" fill="#2B3442">and the system</text>
<text x="970" y="308.7" font-size="17" fill="#2B3442">peripherals</text>
<text x="321" y="466.4" font-size="20" font-weight="700" fill="#8A3C0B">Reads back</text>
<text x="321" y="497" font-size="17" fill="#2B3442">Charger input (VBUSIN, USB or</text>
<text x="321" y="521.7" font-size="17" fill="#2B3442">adapter)</text>
<text x="321" y="546.3" font-size="17" fill="#2B3442">Li-ion cell (VBATT and its thermistor</text>
<text x="321" y="571" font-size="17" fill="#2B3442">on THM)</text>
<text x="321" y="595.6" font-size="17" fill="#2B3442">Push buttons (ONKEY, PWRON)</text>
<text x="48" y="702.6" font-size="24" font-weight="700" fill="#0E1726">4.1 to 6.0 V</text>
<text x="48" y="737" font-size="17" fill="#2B3442">charger input on</text>
<text x="48" y="760" font-size="17" fill="#2B3442">VBUSIN, USB or</text>
<text x="48" y="782.9" font-size="17" fill="#2B3442">adapter</text>
<text x="48" y="841.2" font-size="16" fill="#566070">1.1, p. 1</text>
<text x="240" y="707.4" font-size="30" font-weight="700" fill="#0E1726">3 x 1.0 A</text>
<text x="240" y="737" font-size="17" fill="#2B3442">buck converters,</text>
<text x="240" y="760" font-size="17" fill="#2B3442">two with voltage</text>
<text x="240" y="782.9" font-size="17" fill="#2B3442">scaling</text>
<text x="240" y="841.2" font-size="16" fill="#566070">1.1, p. 1</text>
<text x="432" y="707.4" font-size="30" font-weight="700" fill="#0E1726">3 LDOs</text>
<text x="432" y="737" font-size="17" fill="#2B3442">300 mA, 400</text>
<text x="432" y="760" font-size="17" fill="#2B3442">mA and 300 mA</text>
<text x="432" y="841.2" font-size="16" fill="#566070">1.1, p. 1</text>
<text x="624" y="707.4" font-size="30" font-weight="700" fill="#0E1726">up to 1 A</text>
<text x="624" y="737" font-size="17" fill="#2B3442">charge current</text>
<text x="624" y="760" font-size="17" fill="#2B3442">from 100 mA,</text>
<text x="624" y="782.9" font-size="17" fill="#2B3442">charge voltage</text>
<text x="624" y="805.9" font-size="17" fill="#2B3442">3.5 to 4.44 V</text>
<text x="624" y="841.2" font-size="16" fill="#566070">1.1, p. 2</text>
<text x="816" y="707.4" font-size="30" font-weight="700" fill="#0E1726">400 kHz</text>
<text x="816" y="737" font-size="17" fill="#2B3442">I2C, fast mode,</text>
<text x="816" y="760" font-size="17" fill="#2B3442">7-bit address</text>
<text x="816" y="841.2" font-size="16" fill="#566070">9.7.2, p. 72</text>
<text x="1008" y="707.4" font-size="30" font-weight="700" fill="#0E1726">5 x 5 mm</text>
<text x="1008" y="737" font-size="17" fill="#2B3442">40-pin QFN with</text>
<text x="1008" y="760" font-size="17" fill="#2B3442">exposed pad</text>
<text x="1008" y="841.2" font-size="16" fill="#566070">14, p. 139</text>
